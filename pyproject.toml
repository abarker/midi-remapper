[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "midi-event-remapper"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "mididings",
    "JACK-Client",
    "python-osc",
]

[project.optional-dependencies]
dev = ["pytest"]
rt  = ["cython>=3.0"]   # optional: build midi_core Cython extension

[project.scripts]
midi-remapper = "midi_event_remapper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
