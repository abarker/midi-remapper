[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "midi-event-remapper"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "mididings",
    "JACK-Client",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
midi-remapper = "midi_event_remapper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
